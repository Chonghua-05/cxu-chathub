services:
  chatroom-bridge-rust:
    build:
      context: .
      dockerfile: rust/Dockerfile
    image: cxu-chathub:rust
    container_name: chatroom-bridge-rust
    restart: unless-stopped
    # 复用 6199：NapCat 客户端本来就指向 127.0.0.1:6199/ws，不需要动 NapCat，
    # 也不需要额外放行端口。注意：6199 若被旧框架容器占用，必须先停掉旧框架。
    ports:
      - "127.0.0.1:6199:6199"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/data
    # 状态图与播报长图为纯 Rust 渲染（无 Chromium），常驻内存很小
    mem_limit: 256m
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
